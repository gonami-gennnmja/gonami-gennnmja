name: play
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  play:
    if: startsWith(github.event.issue.title, 'pet') || startsWith(github.event.issue.title, 'feed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: make the move
        run: node scripts/play.mjs
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.txt
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets README.md game
          git diff --cached --quiet || (git commit -m "visitor move" && git pull --rebase && git push)
      - uses: actions/github-script@v9
        env:
          REPLY_FILE: ${{ runner.temp }}/reply.txt
        with:
          script: |
            const fs = require("fs");
            const reply = fs.existsSync(process.env.REPLY_FILE) ? fs.readFileSync(process.env.REPLY_FILE, "utf8").trim() : "";
            const n = context.issue.number;
            if (reply) await github.rest.issues.createComment({ ...context.repo, issue_number: n, body: reply });
            await github.rest.issues.update({ ...context.repo, issue_number: n, state: "closed", state_reason: "completed" });
