name: snake
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#FF8FAB&color_dots=#F3EEFF,#FFD9E4,#FFB3C6,#E59BD8,#B49CFF
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/snake.svg
          git diff --cached --quiet || (git commit -m "update snake" && git pull --rebase && git push)
