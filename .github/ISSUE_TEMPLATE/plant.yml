name: 🌱 Plant something
description: Plant a flower, tree or house in the garden on my profile
title: "plant 🌱"
body:
  - type: markdown
    attributes:
      value: "Pick a spot and what to plant, then press **Create**. A bot plants it, thanks you, and closes this issue."
  - type: dropdown
    id: spot
    attributes:
      label: Spot
      description: Columns A–H, rows 1–4 (a planted spot can be planted over)
      options: [A1, B1, C1, D1, E1, F1, G1, H1, A2, B2, C2, D2, E2, F2, G2, H2, A3, B3, C3, D3, E3, F3, G3, H3, A4, B4, C4, D4, E4, F4, G4, H4]
    validations:
      required: true
  - type: dropdown
    id: item
    attributes:
      label: What to plant
      options: ["🌸 Flower", "🌷 Tulip", "🌻 Sunflower", "🌳 Tree", "🍄 Mushroom", "🏠 House", "🪨 Rock", "💗 Heart"]
    validations:
      required: true
